openapi: 3.1.0
info:
  title: THE C1RCLE Frontend Integration API
  version: 0.1.0-draft
  description: |
    Frontend-facing contract for the first integration slice. This is a draft
    contract, not proof that every path is live. Backend route activation remains
    governed by docs/partner-dashboard-v2/execution/API_V2_ROUTE_MANIFEST.md.
    Do not expose Firestore documents or provider payloads.
servers:
  - url: https://api.example.invalid/api/v2
    description: Replace with the approved staging/production API base URL.
security:
  - bearerAuth: []
tags:
  - name: Session
  - name: Organizations
  - name: Public discovery
  - name: Checkout
  - name: Orders
  - name: Tickets
paths:
  /session:
    get:
      tags: [Session]
      summary: Resolve the current session and active organization
      operationId: getSession
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations accessible to the current user
      operationId: listOrganizations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Accessible organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /public/events:
    get:
      tags: [Public discovery]
      summary: List published public events
      operationId: listPublicEvents
      security: []
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: city, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Published events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventListResponse'
  /public/events/{eventIdOrSlug}:
    get:
      tags: [Public discovery]
      summary: Read one published event
      operationId: getPublicEvent
      security: []
      parameters:
        - { $ref: '#/components/parameters/EventIdOrSlug' }
      responses:
        '200':
          description: Published event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEventResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /checkout/quotes:
    post:
      tags: [Checkout]
      summary: Calculate a current checkout quote
      operationId: createCheckoutQuote
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutQuoteRequest' }
      responses:
        '200':
          description: Quote calculated without reserving inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutQuoteResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /checkout/reservations:
    post:
      tags: [Checkout]
      summary: Atomically reserve checkout inventory
      operationId: createCheckoutReservation
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRequest' }
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /orders:
    post:
      tags: [Orders]
      summary: Create an order from a valid reservation
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /orders/{orderId}/payment-intents:
    post:
      tags: [Orders]
      summary: Create a provider payment action for an order
      operationId: createPaymentIntent
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201':
          description: Payment action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/{paymentId}/confirm:
    post:
      tags: [Orders]
      summary: Confirm a provider payment after backend verification
      operationId: confirmPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerPaymentId, providerOrderId, providerSignature]
              properties:
                providerPaymentId: { type: string }
                providerOrderId: { type: string }
                providerSignature: { type: string }
      responses:
        '200':
          description: Verified payment and current order state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /me/orders:
    get:
      tags: [Orders]
      summary: List orders belonging to the current user
      operationId: listMyOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: User-scoped orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me/tickets:
    get:
      tags: [Tickets]
      summary: Read the current user's ticket wallet
      operationId: listMyTickets
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User-scoped ticket wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: FirebaseIDToken
      description: Approved session cookie may be used for web clients instead.
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, nullable: true } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    EventIdOrSlug: { name: eventIdOrSlug, in: path, required: true, schema: { type: string } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string } }
  responses:
    Unauthenticated:
      description: Missing, expired, or revoked session
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Authenticated but not allowed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource does not exist or is not visible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: State, inventory, version, or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Validation:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
        nextCursor: { type: string, nullable: true }
    ErrorDetail:
      type: object
      required: [message]
      properties:
        path: { type: string }
        message: { type: string }
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { $ref: '#/components/schemas/ErrorDetail' } }
        requestId: { type: string, format: uuid }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { const: false }
        error: { $ref: '#/components/schemas/ApiError' }
    Session:
      type: object
      required: [user, memberships, permissions]
      properties:
        user: { $ref: '#/components/schemas/User' }
        activeOrganizationId: { type: string, nullable: true }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        permissions: { type: array, items: { type: string } }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
    Membership:
      type: object
      required: [organizationId, role, status]
      properties:
        organizationId: { type: string }
        role: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }
    Organization:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
    PublicEvent:
      type: object
      required: [id, slug, title, startsAt, venue, ticketTiers]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        venue: { type: string }
        city: { type: string }
        ticketTiers: { type: array, items: { $ref: '#/components/schemas/TicketTier' } }
    TicketTier:
      type: object
      required: [id, name, price, available]
      properties:
        id: { type: string }
        name: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        available: { type: boolean }
        remaining: { type: integer, minimum: 0, nullable: true }
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    CheckoutLine:
      type: object
      required: [tierId, quantity]
      properties:
        tierId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 10 }
    CheckoutQuoteRequest:
      type: object
      required: [eventId, lines]
      properties:
        eventId: { type: string }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CheckoutLine' } }
        promoCode: { type: string, nullable: true }
    CheckoutQuote:
      type: object
      required: [quoteId, eventId, lines, total, expiresAt]
      properties:
        quoteId: { type: string }
        eventId: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/CheckoutLine' } }
        total: { $ref: '#/components/schemas/Money' }
        expiresAt: { type: string, format: date-time }
    ReservationRequest:
      allOf:
        - $ref: '#/components/schemas/CheckoutQuoteRequest'
        - type: object
          required: [quoteId]
          properties: { quoteId: { type: string } }
    Reservation:
      type: object
      required: [reservationId, status, expiresAt, quote]
      properties:
        reservationId: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, CONVERTED, CANCELLED] }
        expiresAt: { type: string, format: date-time }
        quote: { $ref: '#/components/schemas/CheckoutQuote' }
    CreateOrderRequest:
      type: object
      required: [reservationId]
      properties: { reservationId: { type: string } }
    Order:
      type: object
      required: [id, status, total, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING_PAYMENT, PAID, FAILED, CANCELLED, EXPIRED, REFUNDED] }
        total: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
    PaymentIntent:
      type: object
      required: [id, provider, providerOrderId, amount, status]
      properties:
        id: { type: string }
        provider: { type: string, enum: [razorpay] }
        providerOrderId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [CREATED, PROCESSING, SUCCEEDED, FAILED] }
        clientOptions: { type: object, additionalProperties: true }
    Ticket:
      type: object
      required: [id, orderId, eventId, status]
      properties:
        id: { type: string }
        orderId: { type: string }
        eventId: { type: string }
        status: { type: string, enum: [VALID, USED, VOID, TRANSFERRED] }
        displayCode: { type: string }
    SessionResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/Session' }, meta: { $ref: '#/components/schemas/Meta' } }
    OrganizationListResponse:
      type: object
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Organization' } }, meta: { $ref: '#/components/schemas/Meta' } }
    PublicEventResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/PublicEvent' }, meta: { $ref: '#/components/schemas/Meta' } }
    PublicEventListResponse:
      type: object
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/PublicEvent' } }, meta: { $ref: '#/components/schemas/Meta' } }
    CheckoutQuoteResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/CheckoutQuote' }, meta: { $ref: '#/components/schemas/Meta' } }
    ReservationResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/Reservation' }, meta: { $ref: '#/components/schemas/Meta' } }
    OrderResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/Order' }, meta: { $ref: '#/components/schemas/Meta' } }
    PaymentIntentResponse:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/PaymentIntent' }, meta: { $ref: '#/components/schemas/Meta' } }
    OrderListResponse:
      type: object
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, meta: { $ref: '#/components/schemas/Meta' } }
    TicketListResponse:
      type: object
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Ticket' } }, meta: { $ref: '#/components/schemas/Meta' } }
