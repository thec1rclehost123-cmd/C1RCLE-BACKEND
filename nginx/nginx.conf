# nginx sidecar in front of the Fastify gateway (same container, same port
# Render already exposes). TLS/edge-routing stays Render's job — this is
# request hygiene ahead of the app's own plugins/rate-limit.ts, not a
# replacement for it: request-size cap, a coarse defense-in-depth rate zone,
# and hiding the gateway's direct origin.
#
# Runs as the non-root `app` user, so every writable path below is under
# /tmp rather than the default /var/lib/nginx / /var/run.

worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # Fastify's own plugins/rate-limit.ts is the authoritative per-route limiter
  # (per-key, per-class). This zone is a blunt, cheap-to-evaluate outer layer
  # against raw request floods before they reach the app at all.
  limit_req_zone $binary_remote_addr zone=edge:10m rate=50r/s;

  client_max_body_size 15m;

  server {
    listen 8080;

    # Render's own probe + our container HEALTHCHECK both hit this — never
    # rate-limited, never size-capped, so it can't be starved by the zone above.
    location /api/v2/internal/health {
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header Host $host;
    }

    location / {
      limit_req zone=edge burst=100 nodelay;
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
