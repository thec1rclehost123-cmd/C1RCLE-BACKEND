packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@firebase/util'
  - esbuild
  - protobufjs
  - unrs-resolver

# Force tar >=7.5.21 across the entire workspace to remediate CVE-2026-73566.
# The primary fix is the pnpm version bump (11.26.0 bundles a patched tar)
# and the Dockerfile apt-get/sed patch; this is the npm-layer backstop.
overrides:
  tar: '>=7.5.21'
