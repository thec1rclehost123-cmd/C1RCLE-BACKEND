# ─── Security ─────────────────────────────────────────────────────────────────
# Split out from CI because it runs on a different cadence (per-PR *and* weekly)
# and needs elevated `security-events: write`, which CI's fast gates must not
# inherit. Everything here is a real gate — nothing is `continue-on-error`.
name: Security

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  schedule:
    # Mondays 06:15 UTC. Catches CVEs published against unchanged code.
    - cron: '15 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── What changed? ──────────────────────────────────────────────────────────
  # Skip all security scans for docs-only PRs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'prettier.config.mjs'
              - 'vitest.config.mjs'
              - 'Dockerfile'
              - '.dockerignore'

  # ── Static analysis ────────────────────────────────────────────────────────
  # Skip if no code changes (docs-only PRs).
  codeql:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          # `none` is the modern replacement for autobuild on interpreted
          # languages; autobuild on a pure TypeScript repo is wasted minutes.
          build-mode: none
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}

  # ── Dependency supply chain ────────────────────────────────────────────────
  # Skip if no code changes (docs-only PRs).
  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # inline summary comment
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # `critical` (the V1 setting) waves through every high-severity CVE.
          fail-on-severity: high
          # Copyleft licences are incompatible with a closed commercial backend.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure

  # ── Dependency, secret and configuration scanning ──────────────────────────
  # One runner for three scanners. They were three jobs; each needed its own
  # checkout, and two of them needed the same install, so the split bought
  # nothing but wall-clock parallelism on checks that finish in a couple of
  # minutes anyway. `if: always()` keeps them independent — a TruffleHog hit
  # still lets the Trivy result through, so one run tells you everything.
  # Skip if no code changes (docs-only PRs).
  scan:
    name: Dependency, secret & config scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # TruffleHog diffs commit ranges, so it needs the full history.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      # Cache Trivy vulnerability database to avoid re-downloading on every run.
      - name: Cache Trivy database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Audit dependencies
        id: audit
        run: pnpm audit --audit-level=high

      - name: Scan for verified secrets
        id: secrets
        if: always()
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --results=verified,unknown

      # Scan config once, output SARIF. Then gate on the SARIF results.
      - name: Scan Dockerfile and workflow configuration
        id: trivy-config
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          cache-dir: ~/.cache/trivy

      - name: Upload config scan results
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # Gate: fail if the SARIF contains any HIGH/CRITICAL results.
      - name: Fail on HIGH/CRITICAL misconfiguration
        id: config
        if: always()
        run: |
          set -euo pipefail
          if [ -s trivy-config.sarif ]; then
            # Check if SARIF has any results (non-zero length results array)
            results=$(jq '.runs[0].results | length' trivy-config.sarif 2>/dev/null || echo 0)
            if [ "$results" != "0" ] && [ -n "$results" ]; then
              echo "::error::HIGH/CRITICAL misconfiguration found:"
              jq '.runs[0].results[] | {rule: .ruleId, message: .message.text, location: .locations[0].physicalLocation.artifactLocation.uri}' trivy-config.sarif
              exit 1
            fi
          fi
          echo "No HIGH/CRITICAL misconfiguration."

      - name: Scan the dependency tree for known CVEs
        id: cve
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          cache-dir: ~/.cache/trivy

      - name: Summarize
        if: always()
        run: |
          {
            echo "| Scan | Result |"
            echo "| --- | :--- |"
            echo "| pnpm audit | ${{ steps.audit.outcome }} |"
            echo "| Secrets | ${{ steps.secrets.outcome }} |"
            echo "| Config misconfiguration | ${{ steps.config.outcome }} |"
            echo "| Dependency CVEs | ${{ steps.cve.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Supply-chain posture ───────────────────────────────────────────────────
  scorecard:
    name: OSSF Scorecard
    # Scorecard grades the default branch; running it per-PR is noise.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write # publish results to the OpenSSF API
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  security-ok:
    name: Security OK
    if: always()
    needs: [codeql, dependency-review, scan, scorecard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every scan passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$bad" ]; then
            echo "::error::These scans did not pass: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "All security scans green."
