# Local HTTP profile. This is suitable for a host-installed Nginx process
# forwarding to the default Fastify development port. Staging and production
# should render the corresponding profile in deploy/nginx/templates instead.

upstream c1rcle_fastify {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $scheme $c1rcle_forwarded_proto {
    default $scheme;
}

map $host $c1rcle_host_allowed {
    default 0;
    localhost 1;
}

# Local validation intentionally keeps readiness open. The staging and
# production templates require an explicit readiness allowlist supplied by the
# deployment environment.
geo $c1rcle_readiness_allowed {
    default 1;
}

server {
    listen 8081;
    server_name localhost;

    if ($c1rcle_host_allowed = 0) { return 444; }

    client_max_body_size 1m;
    limit_conn c1rcle_edge_connections 100;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/snippets/c1rcle/security-headers.conf;

    include /etc/nginx/snippets/c1rcle/api-locations.conf;
}
