# Per-server request guards, included at server level in every API/BFF server.

# Method allow-list (see $c1rcle_method_ok in edge-maps.conf).
if ($c1rcle_method_ok = 0) { return 405; }

include /etc/nginx/snippets/c1rcle/edge-healthz.conf;

# Dotfiles (/.git, /.env, /.ssh, /.DS_Store ...) are never served. The one
# exception is /.well-known/ (app links, ACME, security.txt).
location ~ /\.(?!well-known(/|$)) {
    access_log off;
    return 404;
}

# Common scanner / exploit probes. None of these exist in any C1RCLE app.
location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc|phpmyadmin|pma|cgi-bin|actuator|server-status|server-info|solr|jenkins|boaform|HNAP1|vendor/phpunit|owa|ecp|autodiscover)(/|\.|$) {
    access_log off;
    return 404;
}

location ~* \.(php|asp|aspx|jsp|cgi|sql|bak|swp|ini)$ {
    access_log off;
    return 404;
}
