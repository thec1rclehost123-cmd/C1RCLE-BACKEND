# Headers that are safe for a Next.js BFF origin at the edge.
#
# Notice what is deliberately ABSENT: Cache-Control. The BFF serves HTML
# pages and static assets; Next.js owns per-route cache policy (its own
# Cache-Control on _next/static and server-rendered routes). Forcing
# no-store here would defeat Next.js asset caching.
#
# HSTS is enabled only by the production HTTPS templates after TLS is
# verified — never here.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;