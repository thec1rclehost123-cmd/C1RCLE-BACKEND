# Shared request forwarding policy for a Next.js BFF upstream.
#
# THIS IS NOT proxy-common.conf. The BFF serves HTML, JS, CSS and SSR output,
# so the edge must NOT force Cache-Control: no-store (Next.js sets its own
# per-route cache directives) and must NOT blank the upstream Cache-Control.
# Identity headers are still washed exactly like the API edge: the client's
# own X-Forwarded-For / X-Forwarded-Proto / request-id are never trusted.
#
# Fastify remains the only trusted downstream for application data. The BFF
# is itself a frontend origin; it carries the browser session cookie through
# to Fastify via the API edge / direct private network call.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $c1rcle_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;

# Preserve the browser session, content framing, and client correlation so
# Next.js and the downstream Fastify calls behave identically to a direct
# browser-origin request.
proxy_set_header Cookie $http_cookie;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Content-Length $http_content_length;
proxy_set_header Accept $http_accept;
proxy_set_header Accept-Encoding $http_accept_encoding;
proxy_set_header X-Client-Request-Id $http_x_client_request_id;

# Prevent clients from smuggling an application identity or a second proxy
# chain through the edge — same policy as the API edge.
proxy_set_header X-User-Id "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Forwarded "";
proxy_set_header X-Original-For "";
proxy_set_header X-Original-Host "";
proxy_set_header X-Original-Proto "";
proxy_set_header X-Original-Url "";
proxy_set_header X-Client-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header CF-Connecting-IP "";

proxy_pass_request_headers on;
proxy_pass_request_body on;
proxy_request_buffering on;
proxy_buffering on;
proxy_redirect off;
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;

# A single BFF upstream is deliberate until capacity/session/idempotency
# coordination across replicas is proven. Retries would be unsafe for
# mutating BFF proxy routes.
proxy_next_upstream off;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;