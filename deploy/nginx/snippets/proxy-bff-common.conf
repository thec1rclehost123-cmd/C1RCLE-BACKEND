# Shared request forwarding policy for a Next.js BFF upstream.
#
# THIS IS NOT proxy-common.conf. The BFF serves HTML, JS, CSS and SSR output,
# so the edge must NOT force Cache-Control: no-store (Next.js sets its own
# per-route cache directives). Identity headers are washed exactly like the
# API edge (see proxy-bff-wash.conf).
#
# Requires `proxy_pass http://$c1rcle_bff_upstream;` in the including
# location, with $c1rcle_bff_upstream set at server level (bff-locations.conf).

proxy_http_version 1.1;
include /etc/nginx/snippets/c1rcle/proxy-bff-wash.conf;

proxy_pass_request_headers on;
proxy_pass_request_body on;
proxy_request_buffering on;
proxy_buffering on;
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;

# Never replay a request already sent upstream if it is non-idempotent
# (POST/PATCH): nginx enforces that unless `non_idempotent` is listed (it is
# not). Safe verbs may fail over when a BFF pool has more than one server.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
