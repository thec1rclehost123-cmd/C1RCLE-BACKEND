# Conservative starting limits for one Fastify gateway instance.
#
# Zones are keyed on $c1rcle_client_ip (templates/client-ip.conf.template): the
# visitor address when Cloudflare has proven it, the socket peer otherwise. Keyed
# on the peer alone, every visitor behind a platform proxy shares one bucket.
#
# These are edge protections, not business quotas. Tune them with measured
# traffic and platform capacity before production rollout.

limit_req_zone $c1rcle_client_ip zone=c1rcle_edge_general:10m rate=10r/s;
limit_req_zone $c1rcle_client_ip zone=c1rcle_edge_auth:10m rate=5r/s;
limit_conn_zone $c1rcle_client_ip zone=c1rcle_edge_connections:10m;
