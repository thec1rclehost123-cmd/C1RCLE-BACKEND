# Edge rate limits. Keyed on $binary_remote_addr, which is the REAL client IP
# when TRUSTED_PROXY_CIDRS is set (realip.conf is generated by the entrypoint);
# otherwise it is the socket peer. These are abuse controls, not business
# quotas; tune with measured traffic.

# --- gateway classes (unchanged names) ---
limit_req_zone $binary_remote_addr zone=c1rcle_edge_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=c1rcle_edge_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=c1rcle_edge_connections:10m;

# --- credential classes, shared by gateway AND BFF auth routes ---
# login/signup: ~1 per 3s sustained. otp/forgot/reset: ~1 per 6s sustained.
limit_req_zone $binary_remote_addr zone=c1rcle_edge_login:5m rate=20r/m;
limit_req_zone $binary_remote_addr zone=c1rcle_edge_otp:5m rate=10r/m;

# --- BFF classes ---
limit_req_zone $binary_remote_addr zone=c1rcle_edge_bff_session:5m rate=5r/s;
limit_req_zone $binary_remote_addr zone=c1rcle_edge_bff_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=c1rcle_edge_bff_pages:10m rate=30r/s;
