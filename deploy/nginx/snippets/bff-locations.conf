# Shared routing for every Next.js BFF server (guest, partner, admin).
#
# The including server MUST first run, at server level:
#   set $c1rcle_bff_upstream c1rcle_bff_<app>;
# (a variable proxy_pass naming an upstream GROUP still uses that group's
# load balancing and keep-alive pool), then include this file followed by the
# app-specific bff-<app>-locations.conf.
#
# Browser-facing BFF route map (all hosts):
#   /api/auth/otp/*                      otp class   (10r/m, burst 3)
#   /api/auth/{forgot,reset}-password    otp class
#   /api/auth/phone-verification         otp class
#   /api/auth/{login,signup}             login class (20r/m, burst 5)
#   /api/auth/*  (refresh,session,logout) session class (5r/s, burst 20)
#   /api/*       (everything else a BFF owns) api class (20r/s, burst 40)
#   /_next/static/*                      no request limit (immutable assets)
#   /*           pages                   pages class (30r/s, burst 100)
#   /api/v2/*    404 here: the gateway is NOT exposed on web hosts.

include /etc/nginx/snippets/c1rcle/edge-errors.conf;
include /etc/nginx/snippets/c1rcle/edge-guards.conf;

location ^~ /api/v2/ {
    return 404;
}

# --- credential classes -----------------------------------------------------
location ^~ /api/auth/otp/ {
    limit_req zone=c1rcle_edge_otp burst=3 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

location = /api/auth/forgot-password {
    limit_req zone=c1rcle_edge_otp burst=3 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

location = /api/auth/reset-password {
    limit_req zone=c1rcle_edge_otp burst=3 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

location = /api/auth/phone-verification {
    limit_req zone=c1rcle_edge_otp burst=3 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

location = /api/auth/login {
    limit_req zone=c1rcle_edge_login burst=5 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

location = /api/auth/signup {
    limit_req zone=c1rcle_edge_login burst=5 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

location ^~ /api/auth/ {
    limit_req zone=c1rcle_edge_bff_session burst=20 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

# --- everything else the BFF owns under /api/ --------------------------------
location ^~ /api/ {
    limit_req zone=c1rcle_edge_bff_api burst=40 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

# --- static assets and pages -------------------------------------------------
location ^~ /_next/static/ {
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}

location / {
    limit_req zone=c1rcle_edge_bff_pages burst=100 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}
