# Guest-portal-only BFF routes (server must set $c1rcle_bff_upstream).
# Auth routes come from bff-locations.conf (login, logout, refresh, session,
# signup, otp/send, otp/verify, forgot-password, reset-password).

# Help-desk BFF: /api/help/tickets, /api/help/tickets/:id, .../messages
location ^~ /api/help/ {
    limit_req zone=c1rcle_edge_bff_api burst=20 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}
