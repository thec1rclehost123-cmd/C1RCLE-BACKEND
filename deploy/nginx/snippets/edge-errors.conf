# Opaque JSON edge errors. Included once per server. Upstream hostnames,
# ports, stack traces and nginx's default HTML pages never reach the client.
# Only nginx-generated errors are rewritten: upstream error bodies (app 4xx/5xx)
# pass through untouched because proxy_intercept_errors stays off.

error_page 400 = @c1rcle_edge_400;
error_page 403 = @c1rcle_edge_403;
error_page 404 = @c1rcle_edge_404;
error_page 405 = @c1rcle_edge_405;
error_page 413 = @c1rcle_edge_413;
error_page 429 = @c1rcle_edge_429;
error_page 500 = @c1rcle_edge_500;
error_page 502 = @c1rcle_edge_502;
error_page 503 = @c1rcle_edge_503;
error_page 504 = @c1rcle_edge_504;

location @c1rcle_edge_400 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 400 '{"status":400,"code":"edge_bad_request","message":"Bad request","requestId":"$request_id"}';
}

location @c1rcle_edge_403 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 403 '{"status":403,"code":"edge_forbidden","message":"Forbidden","requestId":"$request_id"}';
}

location @c1rcle_edge_404 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 404 '{"status":404,"code":"edge_not_found","message":"Not found","requestId":"$request_id"}';
}

location @c1rcle_edge_405 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    add_header Allow "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
    return 405 '{"status":405,"code":"edge_method_not_allowed","message":"Method not allowed","requestId":"$request_id"}';
}

location @c1rcle_edge_413 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 413 '{"status":413,"code":"edge_request_too_large","message":"Request body too large","requestId":"$request_id"}';
}

location @c1rcle_edge_429 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    add_header Retry-After $c1rcle_retry_after always;
    return 429 '{"status":429,"code":"edge_rate_limited","message":"Too many requests","requestId":"$request_id"}';
}

location @c1rcle_edge_500 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 500 '{"status":500,"code":"edge_internal_error","message":"Internal error","requestId":"$request_id"}';
}

location @c1rcle_edge_502 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 502 '{"status":502,"code":"edge_upstream_unavailable","message":"Upstream service unavailable","requestId":"$request_id"}';
}

location @c1rcle_edge_503 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 503 '{"status":503,"code":"edge_upstream_unavailable","message":"Upstream service unavailable","requestId":"$request_id"}';
}

location @c1rcle_edge_504 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 504 '{"status":504,"code":"edge_upstream_timeout","message":"Upstream service timed out","requestId":"$request_id"}';
}
