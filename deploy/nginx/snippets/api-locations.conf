# Shared API routing, rate protection, and structured edge failures.
# Included inside an API server block after that server defines the upstream
# and, for rendered profiles, the readiness token map ($c1rcle_readiness_allowed,
# gated on the X-Readiness-Token header — see NGINX_READINESS_TOKEN).

error_page 413 = @c1rcle_edge_413;
error_page 429 = @c1rcle_edge_429;
error_page 502 = @c1rcle_edge_502;
error_page 503 = @c1rcle_edge_503;
error_page 504 = @c1rcle_edge_504;

location = /api/v2/internal/health {
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location = /api/v2/internal/readiness {
    if ($c1rcle_readiness_allowed = 0) { return 404; }
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location = /api/v2/internal/version {
    if ($c1rcle_readiness_allowed = 0) { return 404; }
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location ^~ /api/v2/auth/ {
    limit_req zone=c1rcle_edge_auth burst=10 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

# Server-Sent Events: the live door-stats stream.
#
# Must come BEFORE the general /api/v2/ prefix location — nginx picks the
# longest matching `^~` prefix, so this wins for exactly this path.
#
# Three settings matter and each fixes a way a stream otherwise looks broken:
#   - proxy_buffering off  : without it nginx holds frames in a buffer and the
#                            first seconds of the stream simply never arrive.
#   - proxy_read_timeout   : the shared 30s would reap the connection between
#                            heartbeats; the app sends a keep-alive comment
#                            every 15s and caps its own streams at 15 minutes,
#                            so 20 minutes here outlives the app's own limit
#                            rather than racing it.
#   - proxy_cache off      : a live occupancy figure must never be cached.
#
# The app also sends `X-Accel-Buffering: no`, which is belt-and-braces for any
# edge that is NOT this config.
location ^~ /api/v2/door/stats/stream {
    limit_req zone=c1rcle_edge_general burst=20 nodelay;
    # Deliberately NOT proxy-common.conf: its single-assignment policy
    # (proxy_buffering on, proxy_cache off, 30s read/send timeouts, HTTP/1.1)
    # conflicts with an unbuffered 20-minute stream — nginx aborts on the
    # duplicate directives. Include only the shared identity wash (keep-alive,
    # header washing), then set stream-specific policy below.
    include /etc/nginx/snippets/c1rcle/proxy-wash-headers.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 20m;
    proxy_send_timeout 20m;
    # SSE is HTTP/1.1 chunked; keep-alive to the upstream must stay on.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://c1rcle_fastify;
}

location ^~ /api/v2/ {
    limit_req zone=c1rcle_edge_general burst=20 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location @c1rcle_edge_413 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 413 '{"status":413,"code":"edge_request_too_large","message":"Request body too large","requestId":"$request_id"}';
}

location @c1rcle_edge_429 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    add_header Retry-After "1" always;
    return 429 '{"status":429,"code":"edge_rate_limited","message":"Too many requests","requestId":"$request_id"}';
}

location @c1rcle_edge_502 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 502 '{"status":502,"code":"edge_upstream_unavailable","message":"Upstream service unavailable","requestId":"$request_id"}';
}

location @c1rcle_edge_503 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 503 '{"status":503,"code":"edge_upstream_unavailable","message":"Upstream service unavailable","requestId":"$request_id"}';
}

location @c1rcle_edge_504 {
    default_type application/json;
    include /etc/nginx/snippets/c1rcle/security-headers.conf;
    add_header X-Request-Id $request_id always;
    return 504 '{"status":504,"code":"edge_upstream_timeout","message":"Upstream service timed out","requestId":"$request_id"}';
}
