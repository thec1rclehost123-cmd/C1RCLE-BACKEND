# Shared API routing, rate protection, and structured edge failures.
# Included inside an API server block after that server defines the upstream
# and, for rendered profiles, the readiness token map ($c1rcle_readiness_allowed,
# gated on the X-Readiness-Token header — see NGINX_READINESS_TOKEN).
#
# Exposure policy: ONLY /api/v2/<allow-listed resource>/ (see
# $c1rcle_gateway_path_ok in edge-maps.conf) and the gated internal endpoints
# are reachable. Everything else is a JSON 404 generated by nginx.

include /etc/nginx/snippets/c1rcle/edge-errors.conf;
include /etc/nginx/snippets/c1rcle/edge-guards.conf;

location = /api/v2/internal/health {
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

# Every other /api/v2/internal/* (readiness, version, future diagnostics) is
# invisible (404) without the readiness token.
location ^~ /api/v2/internal/ {
    if ($c1rcle_readiness_allowed = 0) { return 404; }
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

# Credential classes (tight burst, 429 JSON + Retry-After via edge-errors).
location ^~ /api/v2/auth/otp/ {
    limit_req zone=c1rcle_edge_otp burst=3 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location ^~ /api/v2/auth/forgot-password {
    limit_req zone=c1rcle_edge_otp burst=3 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location ^~ /api/v2/auth/reset-password {
    limit_req zone=c1rcle_edge_otp burst=3 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location ^~ /api/v2/auth/login {
    limit_req zone=c1rcle_edge_login burst=5 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location ^~ /api/v2/auth/signup {
    limit_req zone=c1rcle_edge_login burst=5 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

location ^~ /api/v2/auth/ {
    limit_req zone=c1rcle_edge_auth burst=10 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

# Server-Sent Events: the live door-stats stream.
#
# Must come BEFORE the general /api/v2/ prefix location — nginx picks the
# longest matching `^~` prefix, so this wins for exactly this path.
#
#   - proxy_buffering off  : otherwise frames sit in a buffer and the stream
#                            looks dead for seconds.
#   - gzip off             : compression would buffer frames too.
#   - proxy_read_timeout   : the app heartbeats every 15s and caps streams at
#                            15 minutes; 20 minutes outlives the app's limit.
#   - X-Accel-Buffering no : also told to any further proxy downstream.
#   - proxy_next_upstream off : a half-delivered stream must never be replayed.
#
# Deliberately NOT proxy-common.conf (its single-assignment buffering/timeout
# policy conflicts); only the shared identity wash is included.
location ^~ /api/v2/door/stats/stream {
    limit_req zone=c1rcle_edge_general burst=20 nodelay;
    limit_conn c1rcle_edge_connections 10;
    include /etc/nginx/snippets/c1rcle/proxy-wash-headers.conf;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20m;
    proxy_send_timeout 20m;
    proxy_next_upstream off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header X-Accel-Buffering "no" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://c1rcle_fastify;
}

location ^~ /api/v2/ {
    if ($c1rcle_gateway_path_ok = 0) { return 404; }
    limit_req zone=c1rcle_edge_general burst=20 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-common.conf;
    proxy_pass http://c1rcle_fastify;
}

# The API host serves nothing else.
location / {
    return 404;
}
