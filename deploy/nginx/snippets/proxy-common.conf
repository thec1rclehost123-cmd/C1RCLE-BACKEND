# Shared request forwarding policy for the Fastify gateway.
#
# Incoming identity headers are never trusted. Nginx replaces the proxy-chain
# headers and Fastify still applies its own trusted-proxy boundary.

proxy_http_version 1.1;

# Identity/chain washing is shared (also used by the SSE stream location).
include /etc/nginx/snippets/c1rcle/proxy-wash-headers.conf;

proxy_pass_request_headers on;
proxy_pass_request_body on;
proxy_request_buffering on;
proxy_buffering on;
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;
proxy_hide_header Cache-Control;
proxy_redirect off;

# Retry policy. nginx never replays a request already sent upstream when the
# method is non-idempotent (POST, PATCH, LOCK) because `non_idempotent` is
# deliberately NOT listed, so a timed-out/5xx POST is never duplicated.
# Connection-level failures (request never sent) and idempotent verbs may move
# to another server in the pool; a single-server pool never retries.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
