# Shared request forwarding policy for the Fastify gateway.
#
# Incoming identity headers are never trusted. Nginx replaces the proxy-chain
# headers and Fastify still applies its own trusted-proxy boundary.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $c1rcle_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;

# Preserve authentication, browser session, organization, and mutation
# semantics required by the current API contract.
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-Organization-Id $http_x_organization_id;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header If-Match $http_if_match;
proxy_set_header X-Client-Request-Id $http_x_client_request_id;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Content-Length $http_content_length;

# Prevent clients from smuggling an application identity or a second proxy
# chain through the edge.
proxy_set_header X-User-Id "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header Forwarded "";

proxy_pass_request_headers on;
proxy_pass_request_body on;
proxy_request_buffering on;
proxy_buffering on;
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;
proxy_redirect off;

# A single upstream is deliberate until a provider/platform supplies an
# independently verified pool. Retries would be unsafe for mutations.
proxy_next_upstream off;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
