# Repeatable request/response policy for a Next.js BFF upstream (no singular
# directives, so it can be included alongside location-specific timeouts).
#
# Set-Cookie / cookies: Set-Cookie passes through untouched and cookie
# Domain/Path are NOT rewritten, so host-only session cookies stay host-only.
# CSRF (X-CSRF-Token), Authorization and X-Organization-Id are not listed
# here on purpose: nginx forwards unlisted request headers unchanged.

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $c1rcle_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;

proxy_set_header Cookie $http_cookie;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Content-Length $http_content_length;
proxy_set_header Accept $http_accept;
proxy_set_header Accept-Encoding $http_accept_encoding;
proxy_set_header X-Client-Request-Id $http_x_client_request_id;

proxy_set_header X-User-Id "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header Forwarded "";
proxy_set_header X-Original-For "";
proxy_set_header X-Original-Host "";
proxy_set_header X-Original-Proto "";
proxy_set_header X-Original-Url "";
proxy_set_header X-Client-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header X-Readiness-Token "";

proxy_pass_header Set-Cookie;
proxy_cookie_domain off;
proxy_cookie_path off;
proxy_redirect off;

include /etc/nginx/snippets/c1rcle/proxy-hide-headers.conf;
