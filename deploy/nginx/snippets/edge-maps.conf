# http-context maps shared by every profile (included once from nginx.conf).

# Only these verbs are ever forwarded. TRACE/CONNECT/odd verbs get 405.
map $request_method $c1rcle_method_ok {
    default 0;
    GET 1;
    HEAD 1;
    POST 1;
    PUT 1;
    PATCH 1;
    DELETE 1;
    OPTIONS 1;
}

# Gateway paths browsers/clients legitimately need on the public API host.
# Everything else under /api/v2/ is answered 404 by nginx and never reaches
# Fastify. /api/v2/internal/* is handled by its own token-gated location.
# To expose a new top-level resource, add it to the alternation below.
map $uri $c1rcle_gateway_path_ok {
    default 0;
    ~^/api/v2/(auth|admin|organizations|onboarding|door|door-codes|events|public|venues|support|partnerships|partner|notifications|follows|leaderboard|promoter-assignments|promoter-connections|session|profile|checkout|payments|webhooks|cover-wallets|wallet|tickets|orders|rsvp|social|finance|promoters|proposals|refunds)(/|$) 1;
}

# Retry-After (seconds) advertised on edge 429s, by rate-limit class.
map $uri $c1rcle_retry_after {
    default 1;
    ~*^/api/(v2/)?auth/(otp|forgot-password|reset-password|phone-verification) 60;
    ~*^/api/(v2/)?auth/(login|signup) 30;
    ~*^/api/(v2/)?auth/ 5;
}

# WebSocket upgrade. An empty Connection header keeps upstream keep-alive
# alive for ordinary requests; "upgrade" is sent only when the client asked.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}
