# Shared TLS parameter block (http-context). Included by the full-edge
# production template so every HTTPS server block inherits one TLS policy.
# Certificates remain per-server because each hostname may need a distinct
# SAN; set them on each server block with ${NGINX_TLS_CERTIFICATE(_KEY)}.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;