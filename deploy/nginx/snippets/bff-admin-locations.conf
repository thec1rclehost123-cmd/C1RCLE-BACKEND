# Admin-console-only BFF routes (server must set $c1rcle_bff_upstream).
# Auth routes come from bff-locations.conf (login, logout, refresh, session).

# /api/health/{readiness,version} expose build/dependency detail: invisible
# (404) unless the caller presents the edge readiness token. The token itself
# is stripped before the request reaches the app.
location ^~ /api/health/ {
    if ($c1rcle_readiness_allowed = 0) { return 404; }
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}
