# Unauthenticated load-balancer liveness probe. Answered by nginx itself and
# never touches an upstream, so an app outage cannot flap the edge out of the
# LB pool (app health stays on /api/v2/internal/health). Not logged.
location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
}
