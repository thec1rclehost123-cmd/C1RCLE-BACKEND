# URL/technology hiding on the response path. Repeatable directive: safe to
# include from any proxying location (via the wash snippets). Upstream
# hostnames, versions and framework fingerprints never reach the browser.
# (nginx's own `Server: nginx` remains; server_tokens off hides the version.)

proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header Via;
proxy_hide_header X-Upstream;
proxy_hide_header X-Upstream-Addr;
proxy_hide_header X-Backend;
proxy_hide_header X-Served-By;
proxy_hide_header X-Runtime;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-Render-Origin-Server;
proxy_hide_header X-Matched-Path;
proxy_hide_header X-Nextjs-Matched-Path;
proxy_hide_header X-Nextjs-Prerender;
