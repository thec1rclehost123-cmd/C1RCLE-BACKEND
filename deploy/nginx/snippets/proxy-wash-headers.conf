# Shared identity-header washing for proxied requests.
#
# Incoming identity headers are never trusted: nginx replaces the proxy-chain
# headers (and blanks any client-supplied application-identity / second-proxy
# headers) before Fastify sees the request. Fastify still applies its own
# trusted-proxy boundary on top.
#
# Include this snippet in ANY location that proxies to an upstream:
#   - the API edge locations, via proxy-common.conf, and
#   - the SSE stream location in api-locations.conf, which must NOT inherit
#     proxy-common.conf's single-assignment buffering/timeout policy.
# Every directive here is repeatable (proxy_set_header), so including this
# snippet never conflicts with sibling directives — keep it that way.

proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $c1rcle_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;

# Preserve authentication, browser session, organization, and mutation
# semantics required by the current API contract.
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-Organization-Id $http_x_organization_id;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header If-Match $http_if_match;
proxy_set_header X-Client-Request-Id $http_x_client_request_id;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Content-Length $http_content_length;

# Prevent clients from smuggling an application identity or a second proxy
# chain through the edge.
proxy_set_header X-User-Id "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Forwarded "";
proxy_set_header X-Original-For "";
proxy_set_header X-Original-Host "";
proxy_set_header X-Original-Proto "";
proxy_set_header X-Original-Url "";
proxy_set_header X-Client-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header CF-Connecting-IP "";