# Partner-dashboard-only BFF routes (server must set $c1rcle_bff_upstream).
# Auth routes come from bff-locations.conf (login, logout, refresh, session,
# signup, otp/*, phone-verification, forgot-password, reset-password).

# KYC document upload. The BFF buffers the file (<= 5 MiB, enforced by the
# app), asks the gateway for a signed URL and PUTs to storage server-side, so
# this is the ONLY place a larger body and longer timeouts are allowed. It is
# a regex location so it beats the plain /api/bff/ prefix below. Never retried.
location ~ ^/api/bff/onboarding/applications/[^/]+/documents/upload$ {
    client_max_body_size 6m;
    limit_req zone=c1rcle_edge_bff_api burst=10 nodelay;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/c1rcle/proxy-bff-wash.conf;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_pass http://$c1rcle_bff_upstream;
}

# Onboarding / organizations BFF (JSON; the default 1m body limit applies).
location /api/bff/ {
    limit_req zone=c1rcle_edge_bff_api burst=40 nodelay;
    include /etc/nginx/snippets/c1rcle/proxy-bff-common.conf;
    proxy_pass http://$c1rcle_bff_upstream;
}
