# Provider-neutral Nginx edge configuration for the C1RCLE Fastify gateway.
#
# This file is intentionally independent of a cloud load balancer, DNS provider,
# certificate manager, or orchestration platform. The active API server profile
# is supplied by deploy/nginx/conf.d/api.conf locally or rendered from one of
# deploy/nginx/templates/*.conf.template by the deployment runtime.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    charset utf-8;

    log_format c1rcle_json escape=json
        '{"time":"$time_iso8601",'
        '"requestId":"$request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"host":"$host",'
        '"clientIp":"$remote_addr",'
        '"status":$status,'
        '"bytesSent":$bytes_sent,'
        '"requestTime":$request_time,'
        '"upstreamAddress":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status",'
        '"upstreamResponseTime":"$upstream_response_time",'
        '"userAgent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log c1rcle_json;
    error_log /var/log/nginx/error.log warn;

    client_header_timeout 10s;
    client_body_timeout 15s;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    send_timeout 30s;
    keepalive_timeout 65s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/problem+json
        text/css
        text/plain
        text/xml;

    # Only the Nginx edge may define these limits. The key is the socket peer
    # unless a deployment explicitly enables the realip module upstream.
    include /etc/nginx/snippets/c1rcle/rate-limits.conf;

    # Used only by an explicitly enabled WebSocket location. No current C1RCLE
    # route enables that location.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/conf.d/*.conf;
}
