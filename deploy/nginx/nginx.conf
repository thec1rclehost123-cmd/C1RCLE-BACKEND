# Provider-neutral Nginx edge configuration for the C1RCLE Fastify gateway.
#
# This file is intentionally independent of a cloud load balancer, DNS provider,
# certificate manager, or orchestration platform. The active API server profile
# is supplied by deploy/nginx/conf.d/api.conf locally or rendered from one of
# deploy/nginx/templates/*.conf.template by the deployment runtime.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Default (64 bytes on most platforms) is too small for a long
    # NGINX_READINESS_TOKEN shared-secret value used as a map key below —
    # nginx fails to start with "could not build map_hash" otherwise.
    map_hash_bucket_size 256;
    server_names_hash_bucket_size 128;

    server_tokens off;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    reset_timedout_connection on;

    # Generated at container start by nginx-entrypoint.sh from env:
    #   realip.conf   - set_real_ip_from per TRUSTED_PROXY_CIDRS (+ real_ip_header)
    #   resolver.conf - `resolver` for NGINX_UPSTREAM_RESOLVE=1
    # Glob include: absent files are fine (local/host-installed nginx).
    include /etc/nginx/c1rcle-gen/*.conf;

    # No query string (reset/OTP tokens), cookie, authorization or referer is
    # ever logged: $uri is the normalized path only.
    log_format c1rcle_json escape=json
        '{"time":"$time_iso8601",'
        '"requestId":"$request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"host":"$host",'
        '"clientIp":"$remote_addr",'
        '"status":$status,'
        '"bytesSent":$bytes_sent,'
        '"requestTime":$request_time,'
        '"upstreamAddress":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status",'
        '"upstreamConnectTime":"$upstream_connect_time",'
        '"upstreamHeaderTime":"$upstream_header_time",'
        '"upstreamResponseTime":"$upstream_response_time",'
        '"userAgent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log c1rcle_json;
    error_log /var/log/nginx/error.log warn;

    client_header_timeout 10s;
    client_body_timeout 15s;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Upstream responses carry large Set-Cookie headers (session JWTs).
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/problem+json
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Only the Nginx edge may define these limits. The key is the real client
    # IP when TRUSTED_PROXY_CIDRS is configured, else the socket peer.
    include /etc/nginx/snippets/c1rcle/rate-limits.conf;

    # Method allow-list, gateway path allow-list, Retry-After classes and the
    # WebSocket $connection_upgrade map.
    include /etc/nginx/snippets/c1rcle/edge-maps.conf;

    include /etc/nginx/conf.d/*.conf;
}
